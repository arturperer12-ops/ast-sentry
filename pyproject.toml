[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ast-sentry"
version = "0.1.0"
description = "High-precision AST-based static security analyzer and taint auditor with native SARIF output."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Core Maintainer" }
]
keywords = ["security", "ast", "sast", "vulnerability-scanner", "sarif", "taint-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
ast-sentry = "astsentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
